name: Sample Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sleep 8
      - name: Compile
        run: sleep 10

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint
        run: sleep 12

  test:
    runs-on: ${{ matrix.os }}
    needs: [build, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (node ${{ matrix.node }})
        run: sleep 12
      - name: Integration tests
        run: sleep 10

  docs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Build docs
        run: sleep 15

  deploy:
    runs-on: ubuntu-latest
    needs:
      - test
      - docs
    steps:
      - name: Deploy to staging
        run: sleep 10
      - name: Smoke test
        run: sleep 6
